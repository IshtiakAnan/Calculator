<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .calculator {
      width: 380px;
      background: #16213e;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .display {
      background: #0f3460;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .display .expression {
      color: #8a8a9a;
      font-size: 16px;
      min-height: 24px;
      word-break: break-all;
    }

    .display .result {
      color: #e0e0e0;
      font-size: 36px;
      font-weight: 300;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .btn {
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-weight: 500;
      outline: none;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-number {
      background: #1a1a3e;
      color: #e0e0e0;
    }

    .btn-number:hover {
      background: #2a2a4e;
    }

    .btn-operator {
      background: #e94560;
      color: #ffffff;
    }

    .btn-operator:hover {
      background: #ff6b81;
    }

    .btn-function {
      background: #0f3460;
      color: #a8c0ff;
    }

    .btn-function:hover {
      background: #1a4a7a;
    }

    .btn-equals {
      background: #53d8a8;
      color: #1a1a2e;
    }

    .btn-equals:hover {
      background: #6aedb8;
    }

    .btn-clear {
      background: #533a71;
      color: #e0e0e0;
    }

    .btn-clear:hover {
      background: #6b4d8a;
    }

    .btn-zero {
      grid-column: span 2;
    }

    .btn-disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn btn-function" data-action="clear">C</button>
      <button class="btn btn-function" data-action="backspace">⌫</button>
      <button class="btn btn-function" data-action="parenthesis" data-value="(">(</button>
      <button class="btn btn-function" data-action="parenthesis" data-value=")">)</button>
      <button class="btn btn-function" data-action="percent">%</button>

      <button class="btn btn-function btn-disabled" data-action="sin">sin</button>
      <button class="btn btn-function btn-disabled" data-action="cos">cos</button>
      <button class="btn btn-function btn-disabled" data-action="tan">tan</button>
      <button class="btn btn-function" data-action="log">log</button>
      <button class="btn btn-operator" data-action="operator" data-value="/">&divide;</button>

      <button class="btn btn-number" data-action="number" data-value="7">7</button>
      <button class="btn btn-number" data-action="number" data-value="8">8</button>
      <button class="btn btn-number" data-action="number" data-value="9">9</button>
      <button class="btn btn-function" data-action="power">x²</button>
      <button class="btn btn-operator" data-action="operator" data-value="*">&times;</button>

      <button class="btn btn-number" data-action="number" data-value="4">4</button>
      <button class="btn btn-number" data-action="number" data-value="5">5</button>
      <button class="btn btn-number" data-action="number" data-value="6">6</button>
     <button class="btn btn-function" data-action="sqrt">&radic;</button>
      <button class="btn btn-operator" data-action="operator" data-value="-">&minus;</button>

      <button class="btn btn-number" data-action="number" data-value="1">1</button>
      <button class="btn btn-number" data-action="number" data-value="2">2</button>
      <button class="btn btn-number" data-action="number" data-value="3">3</button>
<button class="btn btn-function" data-action="pi">&pi;</button>
      <button class="btn btn-operator" data-action="operator" data-value="+">&plus;</button>

      <button class="btn btn-number" data-action="number" data-value="0">0</button>
      <button class="btn btn-number" data-action="decimal">.</button>
      <button class="btn btn-equals" data-action="equals" style="grid-column: span 2;">=</button>
    </div>
  </div>

  <script>
    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');

    let currentExpression = '';
    let currentInput = '0';
    let shouldResetScreen = false;
    let lastInputType = '';

    function updateDisplay() {
      resultEl.textContent = currentInput;
      expressionEl.textContent = currentExpression;
    }

    function isOperator(char) {
      return ['+', '-', '*', '/'].includes(char);
    }

    function getLastChar() {
      return currentExpression.slice(-1);
    }

    function appendNumber(number) {
      if (lastInputType === 'equals' || currentInput === '0' && currentExpression === '' || shouldResetScreen || lastInputType === 'operator' || lastInputType === 'left-paren') {
        if (lastInputType === 'equals') {
          currentExpression = number;
        } else if (isOperator(getLastChar()) || getLastChar() === '(' || currentExpression === '') {
          currentExpression += number;
        }
        currentInput = number;
      } else {
        currentExpression += number;
        currentInput = currentInput === '0' ? number : currentInput + number;
      }

      shouldResetScreen = false;
      lastInputType = 'number';
      updateDisplay();
    }

    function appendDecimal() {
      if (lastInputType === 'equals' || shouldResetScreen || currentExpression === '' || isOperator(getLastChar()) || getLastChar() === '(') {
        currentExpression += '0.';
        currentInput = '0.';
      } else if (!currentInput.includes('.')) {
        currentExpression += '.';
        currentInput += '.';
      }

      shouldResetScreen = false;
      lastInputType = 'number';
      updateDisplay();
    }

    function appendParenthesis(value) {
      const openCount = (currentExpression.match(/\(/g) || []).length;
      const closeCount = (currentExpression.match(/\)/g) || []).length;

      if (value === '(') {
        if (lastInputType === 'number' || lastInputType === 'right-paren') {
          currentExpression += '*(';
        } else {
          currentExpression += '(';
        }
        currentInput = '(';
        lastInputType = 'left-paren';
      } else {
        if (openCount > closeCount && lastInputType !== 'operator' && lastInputType !== 'left-paren' && currentExpression !== '') {
          currentExpression += ')';
          currentInput = ')';
          lastInputType = 'right-paren';
          shouldResetScreen = true;
        }
      }

      updateDisplay();
    }

    function setOperator(op) {
      if (currentExpression === '' && op === '-') {
        currentExpression = '-';
        currentInput = '-';
        lastInputType = 'number';
        updateDisplay();
        return;
      }

      if (lastInputType === 'operator') {
        currentExpression = currentExpression.slice(0, -1) + op;
      } else if (lastInputType === 'left-paren') {
        if (op === '-') {
          currentExpression += '-';
          currentInput = '-';
          lastInputType = 'number';
          updateDisplay();
          return;
        }
        return;
      } else if (lastInputType === 'equals') {
        currentExpression = currentInput + op;
      } else {
        currentExpression += op;
      }

      currentInput = op;
      shouldResetScreen = false;
      lastInputType = 'operator';
      updateDisplay();
    }

    function calculate() {
      if (currentExpression === '' || lastInputType === 'operator' || lastInputType === 'left-paren') return;

      const openCount = (currentExpression.match(/\(/g) || []).length;
      const closeCount = (currentExpression.match(/\)/g) || []).length;
      const expressionToEval = currentExpression + ')'.repeat(openCount - closeCount);

      try {
        const result = eval(expressionToEval);
        if (result === Infinity || result === -Infinity || Number.isNaN(result)) {
          throw new Error('Invalid result');
        }

        currentInput = formatResult(result);
        currentExpression = currentInput;
        lastInputType = 'equals';
        shouldResetScreen = true;
      } catch (error) {
        currentInput = 'Error';
        currentExpression = '';
        lastInputType = '';
        shouldResetScreen = true;
      }

      updateDisplay();
    }

    function formatResult(num) {
      if (!Number.isFinite(num)) {
        return 'Error';
      }
      if (Number.isInteger(num)) {
        return num.toString();
      }
      return parseFloat(num.toPrecision(10)).toString();
    }

    function clear() {
      currentExpression = '';
      currentInput = '0';
      shouldResetScreen = false;
      lastInputType = '';
      updateDisplay();
    }

    function backspace() {
      if (currentInput === 'Error') {
        clear();
        return;
      }

      currentExpression = currentExpression.slice(0, -1);
      if (currentExpression === '') {
        currentInput = '0';
        lastInputType = '';
        updateDisplay();
        return;
      }

      const lastChar = getLastChar();
      if (isOperator(lastChar)) {
        currentInput = lastChar;
        lastInputType = 'operator';
      } else if (lastChar === '(') {
        currentInput = '(';
        lastInputType = 'left-paren';
      } else if (lastChar === ')') {
        currentInput = ')';
        lastInputType = 'right-paren';
      } else {
        const token = currentExpression.match(/(?:Math\.PI|\d+(?:\.\d+)?)+$/);
        currentInput = token ? token[0] : currentExpression;
        lastInputType = /\d|Math\.PI/.test(lastChar) ? 'number' : '';
      }

      updateDisplay();
    }

    function square() {
      if (currentInput === 'Error') return;
      const num = parseFloat(currentInput);
      const squared = Math.pow(num, 2);
      currentInput = formatResult(squared);
      currentExpression = currentInput;
      shouldResetScreen = true;
      lastInputType = 'equals';
      updateDisplay();
    }

    function insertPi() {
      if (lastInputType === 'number' || lastInputType === 'right-paren') {
        currentExpression += '*Math.PI';
      } else {
        currentExpression += 'Math.PI';
      }
      currentInput = 'π';
      shouldResetScreen = false;
      lastInputType = 'number';
      updateDisplay();
    }

    function squareRoot() {
      if (currentInput === 'Error') return;
      const num = parseFloat(currentInput);
      if (num < 0) {
        currentInput = 'Error';
        currentExpression = '';
      } else {
        currentInput = formatResult(Math.sqrt(num));
        currentExpression = currentInput;
      }
      shouldResetScreen = true;
      lastInputType = 'equals';
      updateDisplay();
    }

    function logarithm() {
      if (currentInput === 'Error') return;
      const num = parseFloat(currentInput);
      if (num <= 0) {
        currentInput = 'Error';
        currentExpression = '';
      } else {
        currentInput = formatResult(Math.log10(num));
        currentExpression = currentInput;
      }
      shouldResetScreen = true;
      lastInputType = 'equals';
      updateDisplay();
    }

    function applyPercent() {
      if (currentExpression === '' || lastInputType === 'operator' || lastInputType === 'left-paren') return;

      if (currentExpression.endsWith(')')) {
        currentExpression += '/100';
      } else {
        currentExpression = currentExpression.replace(/(Math\.PI|\d+(?:\.\d+)?)$/,'($1/100)');
      }

      try {
        currentInput = formatResult(eval(currentExpression));
        lastInputType = 'number';
        shouldResetScreen = true;
      } catch (error) {
        currentInput = 'Error';
        currentExpression = '';
        lastInputType = '';
        shouldResetScreen = true;
      }

      updateDisplay();
    }

    document.querySelectorAll('.btn').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        const value = button.dataset.value;

        if (button.classList.contains('btn-disabled')) {
          return;
        }

        switch (action) {
          case 'power':
    square();
    break;



case 'sqrt':
    squareRoot();
    break;
    case 'log':
    logarithm();
    break;
          case 'number':
            appendNumber(value);
            break;
          case 'decimal':
            appendDecimal();
            break;
          case 'operator':
            setOperator(value);
            break;
          case 'parenthesis':
            appendParenthesis(value);
            break;
          case 'equals':
            calculate();
            break;
          case 'clear':
            clear();
            break;  
          case 'backspace':
            backspace();
            break;
          case 'percent':
            applyPercent();
            break;
          case 'pi':
            insertPi();
            break;
        }
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        appendNumber(e.key);
      } else if (e.key === '.') {
        appendDecimal();
      } else if (e.key === '%') {
        applyPercent();
      } else if (e.key === '(') {
        appendParenthesis('(');
      } else if (e.key === ')') {
        appendParenthesis(')');
      } else if (e.key === '+') {
        setOperator('+');
      } else if (e.key === '-') {
        setOperator('-');
      } else if (e.key === '*') {
        setOperator('*');
      } else if (e.key === '/') {
        e.preventDefault();
        setOperator('/');
      } else if (e.key === 'Enter' || e.key === '=') {
        calculate();
      } else if (e.key === 'Backspace') {
        backspace();
      } else if (e.key === 'Escape') {
        clear();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
