<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .calculator {
      width: 380px;
      background: #16213e;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .display {
      background: #0f3460;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .display .expression {
      color: #8a8a9a;
      font-size: 16px;
      min-height: 24px;
      word-break: break-all;
      overflow-x: auto;
      white-space: nowrap;
    }

    .display .result {
      color: #e0e0e0;
      font-size: 36px;
      font-weight: 300;
      word-break: break-all;
      overflow-x: auto;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .btn {
      padding: 18px 0;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-weight: 500;
      outline: none;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-number {
      background: #1a1a3e;
      color: #e0e0e0;
    }

    .btn-number:hover {
      background: #2a2a4e;
    }

    .btn-operator {
      background: #e94560;
      color: #ffffff;
    }

    .btn-operator:hover {
      background: #ff6b81;
    }

    .btn-function {
      background: #0f3460;
      color: #a8c0ff;
    }

    .btn-function:hover {
      background: #1a4a7a;
    }

    .btn-equals {
      background: #53d8a8;
      color: #1a1a2e;
    }

    .btn-equals:hover {
      background: #6aedb8;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn btn-function" data-action="clear">C</button>
      <button class="btn btn-function" data-action="backspace">⌫</button>
      <button class="btn btn-function" data-action="parenthesis" data-value="(">(</button>
      <button class="btn btn-function" data-action="parenthesis" data-value=")">)</button>
      <button class="btn btn-function" data-action="percent">%</button>

      <button class="btn btn-function" data-action="function" data-value="sin">sin</button>
      <button class="btn btn-function" data-action="function" data-value="cos">cos</button>
      <button class="btn btn-function" data-action="function" data-value="tan">tan</button>
      <button class="btn btn-function" data-action="function" data-value="log">log</button>
      <button class="btn btn-operator" data-action="operator" data-value="/">&divide;</button>

      <button class="btn btn-number" data-action="number" data-value="7">7</button>
      <button class="btn btn-number" data-action="number" data-value="8">8</button>
      <button class="btn btn-number" data-action="number" data-value="9">9</button>
      <button class="btn btn-function" data-action="operator" data-value="^">x²</button>
      <button class="btn btn-operator" data-action="operator" data-value="*">&times;</button>

      <button class="btn btn-number" data-action="number" data-value="4">4</button>
      <button class="btn btn-number" data-action="number" data-value="5">5</button>
      <button class="btn btn-number" data-action="number" data-value="6">6</button>
      <button class="btn btn-function" data-action="function" data-value="sqrt">&radic;</button>
      <button class="btn btn-operator" data-action="operator" data-value="-">&minus;</button>

      <button class="btn btn-number" data-action="number" data-value="1">1</button>
      <button class="btn btn-number" data-action="number" data-value="2">2</button>
      <button class="btn btn-number" data-action="number" data-value="3">3</button>
      <button class="btn btn-function" data-action="pi">&pi;</button>
      <button class="btn btn-operator" data-action="operator" data-value="+">&plus;</button>

      <button class="btn btn-number" data-action="number" data-value="0">0</button>
      <button class="btn btn-number" data-action="decimal">.</button>
      <button class="btn btn-equals" data-action="equals" style="grid-column: span 3;">=</button>
    </div>
  </div>

  <script src="calculator.js"></script>
  <script>
    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');

    const calculator = new CalculatorEngine();

    function updateDisplay() {
      const displayStr = calculator.getDisplayExpression();
      expressionEl.textContent = calculator.isEvaluated ? displayStr + ' =' : '';

      if (!calculator.isEvaluated) {
        resultEl.textContent = displayStr || '0';
      }
    }

    function calculate() {
      if (calculator.exprTokens.length === 0) return;
      const initialExpr = calculator.getDisplayExpression();
      const res = calculator.calculate();
      updateDisplay();
      resultEl.textContent = res.result;
      if (res.result === 'Error') {
        expressionEl.textContent = initialExpr + ' =';
      }
    }

    function clearAll() {
      calculator.clearAll();
      resultEl.textContent = '0';
      expressionEl.textContent = '';
    }

    // --- Event Listeners ---
    document.querySelectorAll('.btn').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        const value = button.dataset.value;

        switch (action) {
          case 'number': calculator.appendNumber(value); updateDisplay(); break;
          case 'decimal': calculator.appendDecimal(); updateDisplay(); break;
          case 'operator': calculator.appendOperator(value); updateDisplay(); break;
          case 'function': calculator.appendFunction(value); updateDisplay(); break;
          case 'parenthesis': calculator.appendParenthesis(value); updateDisplay(); break;
          case 'equals': calculate(); break;
          case 'clear': clearAll(); break;
          case 'backspace': calculator.backspace(); updateDisplay(); break;
          case 'percent': calculator.applyPercent(); updateDisplay(); break;
          case 'pi': calculator.insertPi(); updateDisplay(); break;
        }
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') { calculator.appendNumber(e.key); updateDisplay(); }
      else if (e.key === '.') { calculator.appendDecimal(); updateDisplay(); }
      else if (e.key === '+') { calculator.appendOperator('+'); updateDisplay(); }
      else if (e.key === '-') { calculator.appendOperator('-'); updateDisplay(); }
      else if (e.key === '*') { calculator.appendOperator('*'); updateDisplay(); }
      else if (e.key === '/') { e.preventDefault(); calculator.appendOperator('/'); updateDisplay(); }
      else if (e.key === '^') { calculator.appendOperator('^'); updateDisplay(); }
      else if (e.key === '%') { calculator.applyPercent(); updateDisplay(); }
      else if (e.key === '(') { calculator.appendParenthesis('('); updateDisplay(); }
      else if (e.key === ')') { calculator.appendParenthesis(')'); updateDisplay(); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Backspace') { calculator.backspace(); updateDisplay(); }
      else if (e.key === 'Escape') clearAll();
      else if (e.key.toLowerCase() === 's') { calculator.appendFunction('sin'); updateDisplay(); }
      else if (e.key.toLowerCase() === 'c') { calculator.appendFunction('cos'); updateDisplay(); }
      else if (e.key.toLowerCase() === 't') { calculator.appendFunction('tan'); updateDisplay(); }
      else if (e.key.toLowerCase() === 'l') { calculator.appendFunction('log'); updateDisplay(); }
      else if (e.key.toLowerCase() === 'p') { calculator.insertPi(); updateDisplay(); }
      else if (e.key.toLowerCase() === 'r') { calculator.appendFunction('sqrt'); updateDisplay(); }
    });

    updateDisplay();
  </script>
</body>

</html>
