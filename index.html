<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .calculator {
      width: 380px;
      background: #16213e;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .display {
      background: #0f3460;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .display .expression {
      color: #8a8a9a;
      font-size: 16px;
      min-height: 24px;
      word-break: break-all;
      overflow-x: auto;
      white-space: nowrap;
    }

    .display .result {
      color: #e0e0e0;
      font-size: 36px;
      font-weight: 300;
      word-break: break-all;
      overflow-x: auto;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .btn {
      padding: 18px 0;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-weight: 500;
      outline: none;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-number {
      background: #1a1a3e;
      color: #e0e0e0;
    }

    .btn-number:hover {
      background: #2a2a4e;
    }

    .btn-operator {
      background: #e94560;
      color: #ffffff;
    }

    .btn-operator:hover {
      background: #ff6b81;
    }

    .btn-function {
      background: #0f3460;
      color: #a8c0ff;
    }

    .btn-function:hover {
      background: #1a4a7a;
    }

    .btn-equals {
      background: #53d8a8;
      color: #1a1a2e;
    }

    .btn-equals:hover {
      background: #6aedb8;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn btn-function" data-action="clear">C</button>
      <button class="btn btn-function" data-action="backspace">⌫</button>
      <button class="btn btn-function" data-action="parenthesis" data-value="(">(</button>
      <button class="btn btn-function" data-action="parenthesis" data-value=")">)</button>
      <button class="btn btn-function" data-action="percent">%</button>

      <button class="btn btn-function" data-action="function" data-value="sin">sin</button>
      <button class="btn btn-function" data-action="function" data-value="cos">cos</button>
      <button class="btn btn-function" data-action="function" data-value="tan">tan</button>
      <button class="btn btn-function" data-action="function" data-value="log">log</button>
      <button class="btn btn-operator" data-action="operator" data-value="/">&divide;</button>

      <button class="btn btn-number" data-action="number" data-value="7">7</button>
      <button class="btn btn-number" data-action="number" data-value="8">8</button>
      <button class="btn btn-number" data-action="number" data-value="9">9</button>
      <button class="btn btn-function" data-action="operator" data-value="^">x²</button>
      <button class="btn btn-operator" data-action="operator" data-value="*">&times;</button>

      <button class="btn btn-number" data-action="number" data-value="4">4</button>
      <button class="btn btn-number" data-action="number" data-value="5">5</button>
      <button class="btn btn-number" data-action="number" data-value="6">6</button>
      <button class="btn btn-function" data-action="function" data-value="sqrt">&radic;</button>
      <button class="btn btn-operator" data-action="operator" data-value="-">&minus;</button>

      <button class="btn btn-number" data-action="number" data-value="1">1</button>
      <button class="btn btn-number" data-action="number" data-value="2">2</button>
      <button class="btn btn-number" data-action="number" data-value="3">3</button>
      <button class="btn btn-function" data-action="pi">&pi;</button>
      <button class="btn btn-operator" data-action="operator" data-value="+">&plus;</button>

      <button class="btn btn-number" data-action="number" data-value="0">0</button>
      <button class="btn btn-number" data-action="decimal">.</button>
      <button class="btn btn-equals" data-action="equals" style="grid-column: span 3;">=</button>
    </div>
  </div>

  <script>
    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');

    let exprTokens = [];
    let isEvaluated = false;

    function updateDisplay() {
      const displayStr = exprTokens.map(t => {
        if (t === '*') return '×';
        if (t === '/') return '÷';
        if (t === '-') return '−';
        if (t === 'sqrt(') return '√(';
        if (t === 'PI') return 'π';
        return t;
      }).join(' ');

      expressionEl.textContent = isEvaluated ? displayStr + ' =' : '';

      if (!isEvaluated) {
        resultEl.textContent = displayStr || '0';
      }
    }

    function formatResult(num) {
      if (isNaN(num) || !isFinite(num)) return 'Error';
      if (Math.abs(num) < 1e-12) return '0';
      const rounded = Math.round(num);
      if (Math.abs(num - rounded) < 1e-12) return rounded.toString();
      return parseFloat(num.toFixed(10)).toString();
    }

    // --- Expression Parser & Evaluator (Shunting-Yard) ---
    function evaluateTokens(tokens) {
      if (tokens.length === 0) return 0;

      const outputQueue = [];
      const operatorStack = [];

      const precedence = { '+': 1, '-': 1, '*': 2, '/': 2, '^': 3, '%': 2 };
      const rightAssociative = { '^': true };

      const isNumber = str => !isNaN(parseFloat(str)) || str === 'PI';
      const isFunction = str => ['sin(', 'cos(', 'tan(', 'log(', 'sqrt('].includes(str);
      const isOperator = str => ['+', '-', '*', '/', '^', '%'].includes(str);

      for (let i = 0; i < tokens.length; i++) {
        let token = tokens[i];

        if (isNumber(token)) {
          outputQueue.push(token === 'PI' ? Math.PI : parseFloat(token));
        } else if (isFunction(token)) {
          operatorStack.push(token);
        } else if (isOperator(token)) {
          // Check for unary minus
          if (token === '-' && (i === 0 || tokens[i - 1] === '(' || isOperator(tokens[i - 1]))) {
            outputQueue.push(0); // Insert 0 before unary minus: e.g. -5 -> 0 - 5
          }
          while (
            operatorStack.length > 0 &&
            isOperator(operatorStack[operatorStack.length - 1]) &&
            ((!rightAssociative[token] && precedence[token] <= precedence[operatorStack[operatorStack.length - 1]]) ||
              (rightAssociative[token] && precedence[token] < precedence[operatorStack[operatorStack.length - 1]]))
          ) {
            outputQueue.push(operatorStack.pop());
          }
          operatorStack.push(token);
        } else if (token === '(') {
          operatorStack.push(token);
        } else if (token === ')') {
          while (operatorStack.length > 0 && operatorStack[operatorStack.length - 1] !== '(') {
            outputQueue.push(operatorStack.pop());
          }
          if (operatorStack.length === 0) throw new Error("Mismatched parentheses");
          operatorStack.pop(); // Pop '('

          if (operatorStack.length > 0 && isFunction(operatorStack[operatorStack.length - 1])) {
            outputQueue.push(operatorStack.pop());
          }
        }
      }

      while (operatorStack.length > 0) {
        const top = operatorStack.pop();
        if (top === '(' || top === ')') throw new Error("Mismatched parentheses");
        outputQueue.push(top);
      }

      // Evaluate RPN
      const evalStack = [];
      for (let token of outputQueue) {
        if (typeof token === 'number') {
          evalStack.push(token);
        } else if (isOperator(token)) {
          if (evalStack.length < 2) throw new Error("Invalid expression");
          const b = evalStack.pop();
          const a = evalStack.pop();
          switch (token) {
            case '+': evalStack.push(a + b); break;
            case '-': evalStack.push(a - b); break;
            case '*': evalStack.push(a * b); break;
            case '/':
              if (b === 0) throw new Error("Divide by zero");
              evalStack.push(a / b);
              break;
            case '^': evalStack.push(Math.pow(a, b)); break;
            case '%': evalStack.push(a % b); break;
          }
        } else if (isFunction(token)) {
          if (evalStack.length < 1) throw new Error("Invalid function argument");
          const arg = evalStack.pop();
          switch (token) {
            case 'sin(': evalStack.push(Math.sin(arg * Math.PI / 180)); break;
            case 'cos(': evalStack.push(Math.cos(arg * Math.PI / 180)); break;
            case 'tan(': evalStack.push(Math.tan(arg * Math.PI / 180)); break;
            case 'log(':
              if (arg <= 0) throw new Error("Invalid log argument");
              evalStack.push(Math.log10(arg));
              break;
            case 'sqrt(':
              if (arg < 0) throw new Error("Invalid sqrt argument");
              evalStack.push(Math.sqrt(arg));
              break;
          }
        }
      }

      if (evalStack.length !== 1) throw new Error("Invalid expression");
      return evalStack[0];
    }

    // --- Input Handlers ---
    function appendNumber(num) {
      if (isEvaluated) {
        exprTokens = [];
        isEvaluated = false;
      }

      const lastToken = exprTokens[exprTokens.length - 1];
      if (lastToken && !isNaN(lastToken)) {
        exprTokens[exprTokens.length - 1] = lastToken + num;
      } else if (lastToken === 'PI' || lastToken === ')') {
        exprTokens.push('*', num);
      } else {
        exprTokens.push(num);
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (isEvaluated) {
        exprTokens = ['0.'];
        isEvaluated = false;
        updateDisplay();
        return;
      }

      const lastToken = exprTokens[exprTokens.length - 1];
      if (lastToken && !isNaN(lastToken)) {
        if (!lastToken.includes('.')) {
          exprTokens[exprTokens.length - 1] = lastToken + '.';
        }
      } else {
        exprTokens.push('0.');
      }
      updateDisplay();
    }

    function appendOperator(op) {
      if (isEvaluated) isEvaluated = false;

      if (exprTokens.length === 0) {
        if (op === '-') exprTokens.push('-');
        updateDisplay();
        return;
      }

      const lastToken = exprTokens[exprTokens.length - 1];
      const isOp = str => ['+', '-', '*', '/', '^', '%'].includes(str);

      if (isOp(lastToken)) {
        exprTokens[exprTokens.length - 1] = op;
      } else {
        exprTokens.push(op);
      }
      updateDisplay();
    }

    function appendFunction(func) {
      if (isEvaluated) isEvaluated = false;

      const lastToken = exprTokens[exprTokens.length - 1];
      if (lastToken && (!isNaN(lastToken) || lastToken === 'PI' || lastToken === ')')) {
        exprTokens.push('*');
      }
      exprTokens.push(func + '(');
      updateDisplay();
    }

    function appendParenthesis(value) {
      if (value === '(') {
        // If typing '(' after a number or ')', auto-insert multiplication '*'
        if (lastInputType === 'number' || lastInputType === 'right-paren') {
          expression += '*(';
        } else {
          expression += '(';
        }
        currentInput = '(';
        lastInputType = 'left-paren';
      } else {
        // Check if there are open parentheses to close
        const openCount = (expression.match(/\(/g) || []).length;
        const closeCount = (expression.match(/\)/g) || []).length;

        if (openCount > closeCount && lastInputType !== 'operator' && lastInputType !== 'left-paren') {
          expression += ')';
          currentInput = ')';
          lastInputType = 'right-paren';
          // DO NOT set shouldResetScreen = true here!
        }
      }
      updateDisplay();
    }

    function insertPi() {
      if (isEvaluated) {
        exprTokens = [];
        isEvaluated = false;
      }

      const lastToken = exprTokens[exprTokens.length - 1];
      if (lastToken && (!isNaN(lastToken) || lastToken === 'PI' || lastToken === ')')) {
        exprTokens.push('*');
      }
      exprTokens.push('PI');
      updateDisplay();
    }

    function applyPercent() {
      if (exprTokens.length === 0) return;
      appendOperator('%');
    }

    function calculate() {
      if (exprTokens.length === 0) return;

      try {
        const val = evaluateTokens(exprTokens);
        const formatted = formatResult(val);

        isEvaluated = true;
        updateDisplay();
        resultEl.textContent = formatted;

        if (formatted !== 'Error') {
          exprTokens = [formatted];
        } else {
          exprTokens = [];
        }
      } catch (err) {
        expressionEl.textContent = exprTokens.join(' ') + ' =';
        resultEl.textContent = 'Error';
        exprTokens = [];
        isEvaluated = false;
      }
    }

    function clearAll() {
      exprTokens = [];
      isEvaluated = false;
      resultEl.textContent = '0';
      expressionEl.textContent = '';
    }

    function backspace() {
      if (isEvaluated) {
        clearAll();
        return;
      }

      if (exprTokens.length === 0) return;

      const lastToken = exprTokens[exprTokens.length - 1];
      if (!isNaN(lastToken) && lastToken.length > 1) {
        exprTokens[exprTokens.length - 1] = lastToken.slice(0, -1);
      } else {
        exprTokens.pop();
      }
      updateDisplay();
    }

    // --- Event Listeners ---
    document.querySelectorAll('.btn').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        const value = button.dataset.value;

        switch (action) {
          case 'number': appendNumber(value); break;
          case 'decimal': appendDecimal(); break;
          case 'operator': appendOperator(value); break;
          case 'function': appendFunction(value); break;
          case 'parenthesis': appendParenthesis(value); break;
          case 'equals': calculate(); break;
          case 'clear': clearAll(); break;
          case 'backspace': backspace(); break;
          case 'percent': applyPercent(); break;
          case 'pi': insertPi(); break;
        }
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
      else if (e.key === '.') appendDecimal();
      else if (e.key === '+') appendOperator('+');
      else if (e.key === '-') appendOperator('-');
      else if (e.key === '*') appendOperator('*');
      else if (e.key === '/') { e.preventDefault(); appendOperator('/'); }
      else if (e.key === '^') appendOperator('^');
      else if (e.key === '%') applyPercent();
      else if (e.key === '(') appendParenthesis('(');
      else if (e.key === ')') appendParenthesis(')');
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Backspace') backspace();
      else if (e.key === 'Escape') clearAll();
      else if (e.key.toLowerCase() === 's') appendFunction('sin');
      else if (e.key.toLowerCase() === 'c') appendFunction('cos');
      else if (e.key.toLowerCase() === 't') appendFunction('tan');
      else if (e.key.toLowerCase() === 'l') appendFunction('log');
      else if (e.key.toLowerCase() === 'p') insertPi();
      else if (e.key.toLowerCase() === 'r') appendFunction('sqrt');
    });

    updateDisplay();
  </script>
</body>

</html>
