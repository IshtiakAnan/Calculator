<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .calculator {
      width: 380px;
      background: #16213e;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .display {
      background: #0f3460;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .display .expression {
      color: #8a8a9a;
      font-size: 16px;
      min-height: 24px;
      word-break: break-all;
    }

    .display .result {
      color: #e0e0e0;
      font-size: 36px;
      font-weight: 300;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .btn {
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-weight: 500;
      outline: none;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-number {
      background: #1a1a3e;
      color: #e0e0e0;
    }

    .btn-number:hover {
      background: #2a2a4e;
    }

    .btn-operator {
      background: #e94560;
      color: #ffffff;
    }

    .btn-operator:hover {
      background: #ff6b81;
    }

    .btn-function {
      background: #0f3460;
      color: #a8c0ff;
    }

    .btn-function:hover {
      background: #1a4a7a;
    }

    .btn-equals {
      background: #53d8a8;
      color: #1a1a2e;
    }

    .btn-equals:hover {
      background: #6aedb8;
    }

    .btn-clear {
      background: #533a71;
      color: #e0e0e0;
    }

    .btn-clear:hover {
      background: #6b4d8a;
    }

    .btn-zero {
      grid-column: span 2;
    }

    .btn-disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn btn-function" data-action="clear">C</button>
      <button class="btn btn-function" data-action="backspace">⌫</button>
      <button class="btn btn-function" data-action="parenthesis" data-value="(">(</button>
      <button class="btn btn-function" data-action="parenthesis" data-value=")">)</button>
      <button class="btn btn-function" data-action="percent">%</button>

      <button class="btn btn-function" data-action="sin">sin</button>
      <button class="btn btn-function" data-action="cos">cos</button>
      <button class="btn btn-function" data-action="tan">tan</button>
      <button class="btn btn-function btn-disabled" data-action="log">log</button>
      <button class="btn btn-operator" data-action="operator" data-value="/">&divide;</button>

      <button class="btn btn-number" data-action="number" data-value="7">7</button>
      <button class="btn btn-number" data-action="number" data-value="8">8</button>
      <button class="btn btn-number" data-action="number" data-value="9">9</button>
      <button class="btn btn-function" data-action="power">x²</button>
      <button class="btn btn-operator" data-action="operator" data-value="*">&times;</button>

      <button class="btn btn-number" data-action="number" data-value="4">4</button>
      <button class="btn btn-number" data-action="number" data-value="5">5</button>
      <button class="btn btn-number" data-action="number" data-value="6">6</button>
      <button class="btn btn-function" data-action="sqrt">&radic;</button>
      <button class="btn btn-operator" data-action="operator" data-value="-">&minus;</button>

      <button class="btn btn-number" data-action="number" data-value="1">1</button>
      <button class="btn btn-number" data-action="number" data-value="2">2</button>
      <button class="btn btn-number" data-action="number" data-value="3">3</button>
      <button class="btn btn-function" data-action="pi">&pi;</button>
      <button class="btn btn-operator" data-action="operator" data-value="+">&plus;</button>

      <button class="btn btn-number" data-action="number" data-value="0">0</button>
      <button class="btn btn-number" data-action="decimal">.</button>
      <button class="btn btn-equals" data-action="equals" style="grid-column: span 2;">=</button>
    </div>
  </div>

  <script>
    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');

    let currentExpression = '';
    let currentInput = '0';
    let shouldResetScreen = false;
    let expression = '';
    let isTypingTrig = false;
    let operator = null;
    let previousInput = '';
    let lastInputType = '';

    function updateDisplay() {
      if (isTypingTrig) {
        expressionEl.textContent = '';
        resultEl.textContent = expression;
        resultEl.style.fontSize = '42px';
      } else {
        expressionEl.textContent = expression;
        resultEl.textContent = currentInput;
        resultEl.style.fontSize = '36px';
      }
    }

    function formatResult(num) {
      if (Math.abs(num) < 1e-12) {
        return '0';
      }
      const rounded = Math.round(num);
      if (Math.abs(num - rounded) < 1e-12) {
        return rounded.toString();
      }
      return parseFloat(num.toFixed(10)).toString();
    }

    function evaluateExpression(expr) {
      const match = expr.match(/^(sin|cos|tan)\((.+)$/);
      if (match) {
        const func = match[1];
        const valueStr = match[2];
        if (valueStr === '') return NaN;
        const value = parseFloat(valueStr);
        if (isNaN(value)) return NaN;
        const radians = value * (Math.PI / 180);
        switch (func) {
          case 'sin': return Math.sin(radians);
          case 'cos': return Math.cos(radians);
          case 'tan': return Math.tan(radians);
          default: return NaN;
        }
      }
      return parseFloat(expr);
    }

    function appendNumber(number) {
      if (shouldResetScreen) {
        if (expression.match(/^(sin|cos|tan)\($/)) {
          currentInput = number;
          expression += number;
        } else {
          currentInput = number;
          expression = currentInput;
        }
        shouldResetScreen = false;
      } else {
        if (currentInput === '0' && number !== '.') {
          currentInput = number;
          if (expression.match(/^(sin|cos|tan)\(.+$/)) {
            expression = expression.slice(0, -1) + number;
          } else {
            expression = currentInput;
          }
        } else {
          currentInput += number;
          if (expression.match(/^(sin|cos|tan)\(.+$/)) {
            expression += number;
          } else {
            expression += number;
          }
        }
      }
      shouldResetScreen = false;
      lastInputType = 'number';
      updateDisplay();
    }

    function appendDecimal() {
      if (shouldResetScreen) {
        if (expression.match(/^(sin|cos|tan)\($/)) {
          currentInput = '0.';
          expression += '0.';
        } else {
          currentInput = '0.';
          expression = currentInput;
        }
        shouldResetScreen = false;
        updateDisplay();
        return;
      }
      if (!currentInput.includes('.')) {
        currentInput += '.';
        if (expression.match(/^(sin|cos|tan)\(.+$/)) {
          expression += '.';
        } else {
          expression += '.';
        }
      }
      updateDisplay();
    }

    function appendParenthesis(value) {
      if (value === '(') {
        if (lastInputType === 'number' || lastInputType === 'right-paren') {
          expression += '*(';
        } else {
          expression += '(';
        }
        currentInput = '(';
        lastInputType = 'left-paren';
      } else {
        const openCount = (expression.match(/\(/g) || []).length;
        const closeCount = (expression.match(/\)/g) || []).length;
        if (openCount > closeCount && lastInputType !== 'operator' && lastInputType !== 'left-paren') {
          expression += ')';
          currentInput = ')';
          lastInputType = 'right-paren';
          shouldResetScreen = true;
        }
      }
      updateDisplay();
    }

    function applyPercent() {
      if (expression === '' || lastInputType === 'operator' || lastInputType === 'left-paren') return;
      if (expression.endsWith(')')) {
        expression += '/100';
      } else {
        expression = expression.replace(/(Math\.PI|\d+(?:\.\d+)?)$/, '($1/100)');
      }
      try {
        currentInput = formatResult(eval(expression));
        lastInputType = 'number';
        shouldResetScreen = true;
      } catch (error) {
        currentInput = 'Error';
        expression = '';
        lastInputType = '';
        shouldResetScreen = true;
      }
      updateDisplay();
    }

    function insertPi() {
      if (lastInputType === 'number' || lastInputType === 'right-paren') {
        expression += '*Math.PI';
      } else {
        expression += 'Math.PI';
      }
      currentInput = 'π';
      lastInputType = 'number';
      updateDisplay();
    }

    function startTrig(func) {
      expression = func + '(';
      currentInput = '';
      shouldResetScreen = true;
      operator = null;
      previousInput = '';
      isTypingTrig = true;
      updateDisplay();
    }

    function setOperator(op) {
      if (operator !== null && !shouldResetScreen) {
        calculate();
      }
      if (expression && !operator) {
        const val = evaluateExpression(expression);
        if (!isNaN(val)) {
          previousInput = formatResult(val);
          currentInput = formatResult(val);
          isTypingTrig = false;
          expression = formatResult(val) + ' ' + op;
        } else {
          currentInput = 'Error';
          updateDisplay();
          return;
        }
      } else {
        previousInput = currentInput;
        expression = currentInput + ' ' + op;
      }
      operator = op;
      shouldResetScreen = true;
      lastInputType = 'operator';
      updateDisplay();
    }

    function calculate() {
      if (operator === null && expression) {
        const val = evaluateExpression(expression);
        if (!isNaN(val)) {
          currentInput = formatResult(val);
          isTypingTrig = false;
          const match = expression.match(/^(sin|cos|tan)\((.+)$/);
          if (match) {
            expression = match[1] + '(' + match[2] + ')';
          } else {
            expression = currentInput;
          }
          shouldResetScreen = true;
          lastInputType = 'equals';
          updateDisplay();
          return;
        }
      }

      if (operator === null || (shouldResetScreen && previousInput === '')) {
        if (!isNaN(parseFloat(currentInput))) {
          currentInput = formatResult(parseFloat(currentInput));
          updateDisplay();
        }
        return;
      }

      const prev = parseFloat(previousInput);
      const curr = parseFloat(currentInput);
      let result;

      switch (operator) {
        case '+': result = prev + curr; break;
        case '-': result = prev - curr; break;
        case '*': result = prev * curr; break;
        case '/':
          if (curr === 0) {
            currentInput = 'Error';
            operator = null;
            previousInput = '';
            expression = '';
            updateDisplay();
            return;
          }
          result = prev / curr;
          break;
        default: return;
      }

      currentInput = formatResult(result);
      expression = previousInput + ' ' + operator + ' ' + curr + ' = ' + currentInput;
      operator = null;
      previousInput = '';
      shouldResetScreen = true;
      lastInputType = 'equals';
      updateDisplay();
    }

    function applyFunction(func) {
      const value = parseFloat(currentInput);
      let result;

      switch (func) {
        case 'power':
          result = value * value;
          break;
        case 'sqrt':
          result = Math.sqrt(value);
          break;
        case 'log':
          if (value <= 0) {
            currentInput = 'Error';
            expression = '';
            updateDisplay();
            return;
          }
          result = Math.log10(value);
          break;
        default:
          return;
      }

      currentInput = formatResult(result);
      expression = currentInput;
      shouldResetScreen = true;
      lastInputType = 'equals';
      updateDisplay();
    }

    function clear() {
      currentExpression = '';
      currentInput = '0';
      shouldResetScreen = false;
      expression = '';
      isTypingTrig = false;
      operator = null;
      previousInput = '';
      lastInputType = '';
      updateDisplay();
    }

    function backspace() {
      if (shouldResetScreen) return;

      if (currentInput.length > 0) {
        currentInput = currentInput.slice(0, -1);
        expression = expression.slice(0, -1);
        if (currentInput === '') {
          if (expression.match(/^(sin|cos|tan)\($/)) {
            // Keep the trig active, wait for number
          } else {
            if (expression === '') {
              currentInput = '0';
            }
          }
        }
      } else {
        if (expression.match(/^(sin|cos|tan)\($/)) {
          expression = '';
          currentInput = '0';
          isTypingTrig = false;
        } else {
          expression = '';
          currentInput = '0';
          isTypingTrig = false;
        }
      }
      updateDisplay();
    }

    function logarithm() {
      if (currentInput === 'Error') return;
      const num = parseFloat(currentInput);
      if (num <= 0) {
        currentInput = 'Error';
        expression = '';
      } else {
        currentInput = formatResult(Math.log10(num));
        expression = currentInput;
      }
      shouldResetScreen = true;
      lastInputType = 'equals';
      updateDisplay();
    }

    document.querySelectorAll('.btn').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        const value = button.dataset.value;

        if (button.classList.contains('btn-disabled')) {
          return;
        }

        switch (action) {
          case 'number':
            appendNumber(value);
            break;
          case 'decimal':
            appendDecimal();
            break;
          case 'operator':
            setOperator(value);
            break;
          case 'parenthesis':
            appendParenthesis(value);
            break;
          case 'equals':
            calculate();
            break;
          case 'clear':
            clear();
            break;
          case 'backspace':
            backspace();
            break;
          case 'sin':
            startTrig('sin');
            break;
          case 'cos':
            startTrig('cos');
            break;
          case 'tan':
            startTrig('tan');
            break;
          case 'power':
            applyFunction('power');
            break;
          case 'sqrt':
            applyFunction('sqrt');
            break;
          case 'log':
            applyFunction('log');
            break;
          case 'percent':
            applyPercent();
            break;
          case 'pi':
            insertPi();
            break;
        }
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        appendNumber(e.key);
      } else if (e.key === '.') {
        appendDecimal();
      } else if (e.key === '%') {
        applyPercent();
      } else if (e.key === '(') {
        appendParenthesis('(');
      } else if (e.key === ')') {
        appendParenthesis(')');
      } else if (e.key === '+') {
        setOperator('+');
      } else if (e.key === '-') {
        setOperator('-');
      } else if (e.key === '*') {
        setOperator('*');
      } else if (e.key === '/') {
        e.preventDefault();
        setOperator('/');
      } else if (e.key === 'Enter' || e.key === '=') {
        calculate();
      } else if (e.key === 'Backspace') {
        backspace();
      } else if (e.key === 'Escape') {
        clear();
      }
    });

    updateDisplay();
  </script>
</body>

</html>
